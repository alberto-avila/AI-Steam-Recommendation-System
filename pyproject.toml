[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-genrec"
version = "0.1.0"
description = "Steam recommendation experiments using verbalized play histories."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.3"]

[project.optional-dependencies]
verbalizer = ["tokenizers==0.23.2"]
baselines = [
    "numpy==2.2.6",
    "scipy==1.15.3",
    "implicit==0.7.3",
    "threadpoolctl==3.6.0",
]
eda = [
    "pandas==2.2.3",
    "numpy==2.2.6",
    "matplotlib==3.10.3",
    "ipykernel==6.29.5",
    "nbformat==5.10.4",
    "nbclient==0.10.2",
]

[tool.setuptools]
packages = ["src"]

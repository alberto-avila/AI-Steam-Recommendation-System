[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-genrec"
version = "0.1.0"
description = "Steam recommendation experiments using verbalized play histories."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.3"]

[project.optional-dependencies]
verbalizer = ["tokenizers==0.23.2"]
# Install torch first from the CUDA 12.8 index (required for RTX 50-series / sm_120):
#   pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cu128
model = [
    "tokenizers==0.23.2",
    "torch==2.11.0",
    "transformers==5.19.0",
    "peft==0.21.2",
    "bitsandbytes==0.50.2",
    "accelerate==1.15.0",
    "safetensors==0.8.0",
    "huggingface_hub==1.33.0",
    "numpy==2.2.6",
]
baselines = [
    "numpy==2.2.6",
    "scipy==1.15.3",
    "implicit==0.7.3",
    "threadpoolctl==3.6.0",
]
eda = [
    "pandas==2.2.3",
    "numpy==2.2.6",
    "matplotlib==3.10.3",
    "ipykernel==6.29.5",
    "nbformat==5.10.4",
    "nbclient==0.10.2",
]

[tool.setuptools]
packages = ["src"]
